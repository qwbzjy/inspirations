name: Inspirations
options:
  bundleIdPrefix: com.wenbo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
schemes:
  Inspirations:
    build:
      targets:
        Inspirations: all
    run:
      config: Debug

targets:
  Inspirations:
    type: application
    platform: iOS
    sources:
      - Inspirations
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.wenbo.inspirations
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    info:
      path: Inspirations/Info.plist
      properties:
        CFBundleDisplayName: 灵感
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: 录入语音灵感时需要使用麦克风。
        NSSpeechRecognitionUsageDescription: 将你的语音转换为文字，方便随时记录灵感。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
